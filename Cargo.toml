[workspace]
resolver = "2"
members = [
    "demo",
    "demo_android/rust",
    "demo_native",
    "demo_web",
    "hypermocker",
    "walkers",
    "walkers_extras",
    "wanderers",
]

[workspace.package]
version = "0.60.0"
edition = "2024"
rust-version = "1.95"                                # Aligned to egui
repository = "https://github.com/podusowski/walkers"
license = "MIT"
keywords = ["geography", "gis", "gui"]
categories = ["gui", "science::geo"]

[workspace.dependencies]
walkers = { path = "walkers", version = "0.60.0" }
walkers_extras = { path = "walkers_extras", version = "0.60.0" }

android_logger = "0.15.1"
approx = "0.5.1"
bytemuck = { version = "1.25", features = ["derive"] }
bytes = "1.12"
color = { version = "0.3.3", features = ["serde"] }
criterion = "0.8.2"
eframe = "0.36.0"
ecolor = "0.36.0"
egui = { version = "0.36.0", default-features = false }
egui-wgpu = "0.36.0"
emath = "0.36.0"
egui_extras = { version = "0.36.0", features = ["svg"] }
egui-winit = "0.36.0"
env_logger = "0.11.11"
futures = "0.3.33"
geo = { version = "0.33.1", default-features = false }
geo-types = "0.7.20"
geojson = "1.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
http-body-util = "0.1.4"
# Pre-release, but it is the first version supporting `reqwest` 0.13:
http-cache-reqwest = { version = "1.0.0-alpha.9", default-features = false, features = [
  "manager-cacache",
  "reqwest-middleware",
  "url-standard",
] }
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
image = { version = "0.25.10", default-features = false }
kml = { version = "0.14.0", default-features = false }
log = "0.4.33"
lru = "0.18.1"
lyon_path = "1.0"
lyon_tessellation = "1.0"
mvt-reader = "2.4"
pmtiles = { version = "0.24.0", default-features = false, features = [
  "mmap-async-tokio",
] }
quick-xml = "0.42.0"
rand = { version = "0.10.2", features = ["std_rng"] } # StdRng
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  # 0.12 detected the system proxy unconditionally; in 0.13 it is a feature.
  "system-proxy",
] }
reqwest-middleware = "0.5.2"
rstar = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.53"
tokio-test = "0.4.5"
wasm-bindgen-futures = "0.4.76"
web-sys = "0.3.103"

