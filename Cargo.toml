[workspace]
resolver = "2"
members = [
    "demo",
    "demo_android/rust",
    "demo_native",
    "demo_web",
    "hypermocker",
    "walkers",
    "walkers_extras",
]

[workspace.package]
version = "0.56.0"
edition = "2024"
rust-version = "1.92"                                # Aligned to egui
repository = "https://github.com/podusowski/walkers"
license = "MIT"
keywords = ["geography", "gis", "gui"]
categories = ["gui", "science::geo"]

[workspace.dependencies]
android_logger = "0.15.1"
approx = "0.5.1"
bytes = "1.12"
color = { version = "0.3.3", features = ["serde"] }
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["svg"] }
egui-winit = "0.35.0"
env_logger = "0.11.11"
futures = "0.3.33"
geo = { version = "0.33.1", default-features = false }
geo-types = "0.7.20"
geojson = "1.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
http-body-util = "0.1.4"
# 1.0 (the version that supports `reqwest` 0.13) is still a pre-release, so stay on `reqwest` 0.12:
http-cache-reqwest = "0.16.0"
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
image = { version = "0.25.10", default-features = false }
kml = { version = "0.14.0", default-features = false }
log = "0.4.33"
lru = "0.18.1"
lyon_path = "1.0"
lyon_tessellation = "1.0"
mvt-reader = "2.4"
pmtiles = { version = "0.23.1", default-features = false, features = [
  "mmap-async-tokio",
] }
quick-xml = "0.41.0"
rand = { version = "0.10.2", features = ["std_rng"] } # StdRng
# 0.13 is blocked on a stable `http-cache-reqwest` 1.0, which is the first version to support it:
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls",
] }
reqwest-middleware = "0.4.2" # 0.5 requires `reqwest` 0.13
rstar = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.53"
tokio-test = "0.4.5"
walkers = { path = "walkers", version = "0.56.0" }
walkers_extras = { path = "walkers_extras", version = "0.56.0" }
wasm-bindgen-futures = "0.4.76"
web-sys = "0.3.103"
wgpu = { version = "30.0", default-features = true } # 30 would duplicate the `wgpu` 29 that egui 0.35 needs

