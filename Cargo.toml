[workspace]
resolver = "2"
members = [
    "demo",
    "demo_android/rust",
    "demo_native",
    "demo_web",
    "hypermocker",
    "walkers",
    "walkers_extras",
]

[workspace.package]
version = "0.56.0"
edition = "2024"
rust-version = "1.92"                                # Aligned to egui
repository = "https://github.com/podusowski/walkers"
license = "MIT"
keywords = ["geography", "gis", "gui"]
categories = ["gui", "science::geo"]

[workspace.dependencies]
android_logger = "0.15.1"
approx = "0.5.1"
bytes = "1.12"
color = { version = "0.3.2", features = ["serde"] }
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["svg"] }
egui-winit = "0.35.0"
env_logger = "0.11.10"
futures = "0.3.32"
geo = { version = "0.33.1", default-features = false }
geo-types = "0.7.19"
geojson = "1.0"
# `getrandom` is deliberately not a workspace dependency: `walkers` needs 0.2 (for wasm-bindgen 0.2 `js`),
# while `demo` needs 0.3 (`wasm_js`).
http-body-util = "0.1.3"
http-cache-reqwest = "0.16.0"
hyper = { version = "1.9", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
image = { version = "0.25.10", default-features = false }
kml = { version = "0.13.0", default-features = false }
log = "0.4.33"
lru = "0.18.0"
lyon_path = "1.0"
lyon_tessellation = "1.0"
mvt-reader = "2.1"
pmtiles = { version = "0.23.0", default-features = false, features = [
  "mmap-async-tokio",
] }
quick-xml = "0.41.0"
rand = { version = "0.9.4", features = ["std_rng"] } # StdRng + SeedableRng
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls",
] }
reqwest-middleware = "0.4.2"
rstar = "0.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.51"
tokio-test = "0.4.5"
walkers = { path = "walkers", version = "0.56.0" }
walkers_extras = { path = "walkers_extras", version = "0.56.0" }
wasm-bindgen-futures = "0.4.71"
web-sys = "0.3.81"
wgpu = { version = "29.0", default-features = true }

